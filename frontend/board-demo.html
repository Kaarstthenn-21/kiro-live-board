<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiro Live Board - Demo con Datos Mock</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .demo-banner {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            padding: 10px 20px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .total-count-card {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .total-count-label {
            font-size: 1.3rem;
            margin-bottom: 15px;
            opacity: 0.95;
            font-weight: 500;
        }

        .total-count-number {
            font-size: 6rem;
            font-weight: 700;
            line-height: 1;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .chart-card h2 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #667eea;
        }

        .chart-container {
            position: relative;
            height: 300px;
        }

        .recent-attendees {
            grid-column: 1 / -1;
        }

        .recent-attendees h2 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #667eea;
        }

        .attendees-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
        }

        .attendee-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s;
        }

        .attendee-card:hover {
            transform: translateY(-3px);
        }

        .attendee-name {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .attendee-company {
            font-size: 1rem;
            opacity: 0.9;
        }

        .last-updated {
            text-align: center;
            color: white;
            margin-top: 20px;
            font-size: 0.9rem;
            opacity: 0.8;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }

            .dashboard {
                grid-template-columns: 1fr;
            }

            .total-count-number {
                font-size: 4rem;
            }

            .attendees-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎯 Kiro Live Board</h1>
            <p class="subtitle">Registro de Asistentes en Tiempo Real</p>
        </header>

        <div class="demo-banner">
            📊 DEMO MODE - Datos simulados actualizándose cada 3 segundos
        </div>

        <div id="dashboard">
            <div class="dashboard">
                <div class="card total-count-card">
                    <div class="total-count-label">Total de Asistentes</div>
                    <div class="total-count-number" id="totalCount">0</div>
                </div>

                <div class="card chart-card">
                    <h2>📊 Distribución por Interés</h2>
                    <div class="chart-container">
                        <canvas id="interestChart"></canvas>
                    </div>
                </div>
            </div>

            <div class="card recent-attendees">
                <h2>👥 Últimos Registros</h2>
                <div id="attendeesContainer"></div>
            </div>
        </div>

        <div class="last-updated" id="lastUpdated"></div>
    </div>

    <script>
        const REFRESH_INTERVAL = 3000; // 3 seconds
        let interestChart = null;
        let refreshTimer = null;
        let currentCount = 0;

        // Mock data generator
        const firstNames = ['Juan', 'María', 'Carlos', 'Ana', 'Luis', 'Sofia', 'Miguel', 'Laura', 'Pedro', 'Carmen', 'David', 'Isabel', 'Jorge', 'Elena', 'Roberto', 'Patricia'];
        const companies = ['Acme Corp', 'Tech Solutions', 'Innovation Labs', 'Digital Systems', 'Cloud Services', 'Data Analytics', 'Security First', 'DevOps Pro', 'AI Research', 'Tech Innovators', 'Cloud Masters', 'Data Experts', 'Cyber Guard', 'Smart Systems'];
        const interests = ['AI & Machine Learning', 'Cloud Architecture', 'DevOps & Automation', 'Security', 'Data Engineering', 'Other'];

        function generateMockBoardData() {
            // Gradually increase count to simulate new registrations
            if (Math.random() > 0.7) {
                currentCount = Math.min(currentCount + Math.floor(Math.random() * 3) + 1, 50);
            }

            // Generate interest breakdown
            const interestBreakdown = [];
            let remaining = currentCount;
            interests.forEach((interest, idx) => {
                const count = idx === interests.length - 1 
                    ? remaining 
                    : Math.min(Math.floor(Math.random() * (remaining / 2)) + 1, remaining);
                if (count > 0) {
                    interestBreakdown.push({ interest, count });
                    remaining -= count;
                }
            });

            // Sort by count descending
            interestBreakdown.sort((a, b) => b.count - a.count);

            // Generate recent attendees (up to 12)
            const numRecent = Math.min(currentCount, 12);
            const recentAttendees = [];
            for (let i = 0; i < numRecent; i++) {
                const minutesAgo = i * 2;
                const timestamp = new Date(Date.now() - minutesAgo * 60000).toISOString();
                recentAttendees.push({
                    firstName: firstNames[Math.floor(Math.random() * firstNames.length)],
                    company: companies[Math.floor(Math.random() * companies.length)],
                    timestamp
                });
            }

            return {
                totalCount: currentCount,
                interestBreakdown,
                recentAttendees
            };
        }

        function renderDashboard(data) {
            const { totalCount, interestBreakdown, recentAttendees } = data;

            // Update total count with animation
            const countElement = document.getElementById('totalCount');
            const oldCount = parseInt(countElement.textContent) || 0;
            if (totalCount !== oldCount) {
                countElement.style.transition = 'transform 0.3s';
                countElement.style.transform = 'scale(1.1)';
                setTimeout(() => {
                    countElement.textContent = totalCount;
                    countElement.style.transform = 'scale(1)';
                }, 150);
            }

            renderInterestChart(interestBreakdown);
            renderRecentAttendees(recentAttendees);
        }

        function renderInterestChart(interestBreakdown) {
            const ctx = document.getElementById('interestChart');

            if (!interestBreakdown || interestBreakdown.length === 0) {
                if (interestChart) {
                    interestChart.destroy();
                    interestChart = null;
                }
                return;
            }

            const labels = interestBreakdown.map(item => item.interest);
            const counts = interestBreakdown.map(item => item.count);

            const colors = [
                'rgba(102, 126, 234, 0.8)',
                'rgba(118, 75, 162, 0.8)',
                'rgba(237, 100, 166, 0.8)',
                'rgba(255, 154, 158, 0.8)',
                'rgba(250, 208, 196, 0.8)',
                'rgba(189, 224, 254, 0.8)'
            ];

            if (interestChart) {
                interestChart.destroy();
            }

            interestChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Número de Asistentes',
                        data: counts,
                        backgroundColor: colors.slice(0, counts.length),
                        borderColor: colors.slice(0, counts.length).map(c => c.replace('0.8', '1')),
                        borderWidth: 2
                    }]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return `${context.parsed.x} asistente${context.parsed.x !== 1 ? 's' : ''}`;
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            beginAtZero: true,
                            ticks: {
                                precision: 0
                            },
                            grid: {
                                color: 'rgba(0, 0, 0, 0.05)'
                            }
                        },
                        y: {
                            grid: {
                                display: false
                            }
                        }
                    }
                }
            });
        }

        function renderRecentAttendees(recentAttendees) {
            const container = document.getElementById('attendeesContainer');

            if (!recentAttendees || recentAttendees.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 60px; color: #999;">
                        <div style="font-size: 4rem; margin-bottom: 20px;">👋</div>
                        <p style="font-size: 1.5rem; color: #666;">No hay registros aún</p>
                    </div>
                `;
                return;
            }

            const attendeesHTML = recentAttendees.map(attendee => `
                <div class="attendee-card">
                    <div class="attendee-name">${attendee.firstName}</div>
                    <div class="attendee-company">${attendee.company}</div>
                </div>
            `).join('');

            container.innerHTML = `<div class="attendees-grid">${attendeesHTML}</div>`;
        }

        function updateLastUpdatedTime() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('es-ES', { 
                hour: '2-digit', 
                minute: '2-digit', 
                second: '2-digit' 
            });
            document.getElementById('lastUpdated').textContent = `Última actualización: ${timeString}`;
        }

        function fetchBoardData() {
            const data = generateMockBoardData();
            renderDashboard(data);
            updateLastUpdatedTime();
        }

        function startAutoRefresh() {
            if (refreshTimer) {
                clearInterval(refreshTimer);
            }
            refreshTimer = setInterval(fetchBoardData, REFRESH_INTERVAL);
        }

        // Initialize with some starting data
        currentCount = Math.floor(Math.random() * 20) + 10;
        fetchBoardData();
        startAutoRefresh();
    </script>
</body>
</html>
