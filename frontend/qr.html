<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiro Live Board - Escanea para Registrarte</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #0A1E2E;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            color: #FFFFFF;
        }

        .container {
            text-align: center;
            max-width: 1200px;
            width: 100%;
        }

        .logo {
            margin-bottom: 60px;
        }

        .logo h1 {
            font-size: 72px;
            font-weight: 700;
            color: #FFFFFF;
            margin-bottom: 20px;
            letter-spacing: -1px;
        }

        .logo .accent {
            color: #00D9B4;
        }

        .subtitle {
            font-size: 36px;
            color: #FFFFFF;
            font-weight: 300;
            margin-bottom: 80px;
            line-height: 1.4;
        }

        .qr-container {
            background: #FFFFFF;
            padding: 60px;
            border-radius: 24px;
            display: inline-block;
            box-shadow: 0 20px 60px rgba(0, 217, 180, 0.3);
            margin-bottom: 60px;
        }

        #qrcode {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .instructions {
            font-size: 42px;
            color: #00D9B4;
            font-weight: 600;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .details {
            font-size: 28px;
            color: #FFFFFF;
            opacity: 0.8;
            line-height: 1.6;
        }

        .footer {
            margin-top: 80px;
            font-size: 20px;
            color: #FFFFFF;
            opacity: 0.5;
        }

        @media (max-width: 768px) {
            .logo h1 {
                font-size: 48px;
            }

            .subtitle {
                font-size: 24px;
            }

            .qr-container {
                padding: 40px;
            }

            .instructions {
                font-size: 32px;
            }

            .details {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>Kiro <span class="accent">Live Board</span></h1>
        </div>

        <div class="subtitle">
            Regístrate y aparece en el tablero en vivo
        </div>

        <div class="qr-container">
            <div id="qrcode"></div>
        </div>

        <div class="instructions">
            Escanea el código QR
        </div>

        <div class="details">
            Usa la cámara de tu dispositivo móvil<br>
            para registrarte al evento
        </div>

        <div class="footer">
            Powered by AWS Serverless
        </div>
    </div>

    <!-- QRCode.js library from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" 
            integrity="sha512-CNgIRecGo7nphbeZ04Sc13ka07paqdeTu0WR1IM4kNcpmBAUSHSQX0FslNhTDadL4O5SAGapGt4FodqL8My0mA==" 
            crossorigin="anonymous" 
            referrerpolicy="no-referrer"></script>

    <script>
        // Get the current page URL and construct registration URL
        const currentUrl = window.location.href;
        const baseUrl = currentUrl.substring(0, currentUrl.lastIndexOf('/'));
        const registrationUrl = `${baseUrl}/registration.html`;

        // Generate QR Code
        new QRCode(document.getElementById("qrcode"), {
            text: registrationUrl,
            width: 400,
            height: 400,
            colorDark: "#0A1E2E",
            colorLight: "#FFFFFF",
            correctLevel: QRCode.CorrectLevel.H
        });

        // Log URLs for debugging
        console.log('Registration URL:', registrationUrl);
        console.log('QR Code generated successfully');
    </script>
</body>
</html>
